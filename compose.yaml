services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      DATABASE_URL: sqlite:///storage/items.db
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
    volumes:
      - catalogue:/app/storage
    restart: unless-stopped
volumes:
  catalogue:
